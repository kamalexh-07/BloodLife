<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — BloodLife Admin</title>
  <link rel="stylesheet" href="../CSS/admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="admin-mobile-bar">
    <button type="button" id="adminMenuBtn" class="btn btn-outline btn-sm" aria-label="Menu"><i class="fas fa-bars"></i></button>
    <strong style="font-family:var(--font-display);">BloodLife Admin</strong>
    <span></span>
  </div>
  <div id="adminOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:45;" class="admin-overlay"></div>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-brand">
        <span class="admin-brand-badge">BL</span>
        <span>BloodLife</span>
      </div>
      <ul class="admin-nav">
        <li><a href="admin-dashboard.html" data-nav="dashboard"><i class="fas fa-chart-line"></i> Dashboard</a></li>
        <li><a href="admin-donors.html" data-nav="donors"><i class="fas fa-users"></i> Donors</a></li>
        <li><a href="admin-requests.html" data-nav="requests"><i class="fas fa-tint"></i> Requests</a></li>
        <li><a href="admin-profile.html" data-nav="profile"><i class="fas fa-user-shield"></i> Profile</a></li>
      </ul>
      <button type="button" id="adminLogoutBtn" class="btn btn-outline" style="width:100%;margin-top:12px;"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </aside>
    <div class="admin-main">

      <div class="admin-topbar">
        <div><h1>Admin Profile</h1><p>Account details and security</p></div>
      </div>
      <div class="panel" style="max-width:560px;">
        <div class="panel-header"><h2>Profile</h2></div>
        <div class="panel-body">
          <form id="profileForm">
            <div class="form-group">
              <label class="form-label" for="name">Name</label>
              <input class="form-input" id="name" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="email">Email</label>
              <input type="email" class="form-input" id="email" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="mobileNumber">Mobile</label>
              <input class="form-input" id="mobileNumber" placeholder="10-digit number" />
            </div>
            <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save changes</button>
          </form>
        </div>
      </div>
      <div class="panel" style="max-width:560px;">
        <div class="panel-header"><h2>Change password</h2></div>
        <div class="panel-body">
          <form id="passwordForm">
            <div class="form-group">
              <label class="form-label" for="currentPassword">Current password</label>
              <input type="password" class="form-input" id="currentPassword" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="newPassword">New password</label>
              <input type="password" class="form-input" id="newPassword" required minlength="8" />
            </div>
            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirm new password</label>
              <input type="password" class="form-input" id="confirmPassword" required minlength="8" />
            </div>
            <button type="submit" class="btn btn-primary" id="savePasswordBtn">Update password</button>
          </form>
        </div>
      </div>

    </div>
  </div>
  <div id="adminToast" class="toast" role="status"></div>
  <script src="../SCRIPT/admin-common.js"></script>
  <script src="../SCRIPT/admin-profile.js"></script>
</body>
</html>
