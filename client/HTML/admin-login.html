<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — BloodLife</title>
  <link rel="stylesheet" href="../CSS/style.css" />
  <link rel="stylesheet" href="../CSS/admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-badge">A</div>
        <h1>Admin Sign In</h1>
        <p style="margin:0.4rem 0 0; opacity:0.9; font-size:0.9rem;">BloodLife control panel</p>
      </div>
      <div class="auth-card-body">
        <form id="adminLoginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-input" autocomplete="username" required placeholder="admin@example.com" />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div style="position:relative;">
              <input type="password" id="password" class="form-input" autocomplete="current-password" required placeholder="••••••••" style="padding-right:44px;" />
              <button type="button" id="togglePassword" aria-label="Show password" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--color-ink-soft);cursor:pointer;">
                <i class="fas fa-eye" id="togglePasswordIcon"></i>
              </button>
            </div>
          </div>
          <div class="checkbox-group" style="margin-bottom:1rem;">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" />
              Remember me
            </label>
          </div>
          <p id="loginError" class="error-message" style="display:none; margin-bottom:0.75rem;"></p>
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            <span id="btnText">Sign In</span>
          </button>
        </form>
        <p style="text-align:center; margin-top:1.25rem; font-size:0.85rem; color:var(--color-ink-soft);">
          <a href="login.html" class="btn-link">← Back to User Login</a>
        </p>
      </div>
    </div>
  </div>
  <script src="../SCRIPT/admin-common.js"></script>
  <script src="../SCRIPT/admin-login.js"></script>
</body>
</html>
